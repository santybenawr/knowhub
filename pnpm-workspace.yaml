packages:
  - '.'

# Dependencies allowed to run install scripts. pnpm blocks them by default;
# these four need theirs (native binaries and WASM assets), and nothing else
# in the tree does.
allowBuilds:
  esbuild: true
  unrs-resolver: true
  '@tailwindcss/oxide': true
  sharp: true

minimumReleaseAgeExclude:
  - 'js-yaml@4.3.2'
  - '@xmldom/xmldom@0.8.15'
  - '@next/env@16.3.6'
  - '@next/eslint-plugin-next@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'
  - eslint-config-next@16.3.6
  - next@16.3.6

# Security patch for Mammoth's transitive XML parser (GHSA-93r5-fhx6-vmg9
# and related 0.8.14 advisories). Keep the existing 0.8.x compatibility line.
overrides:
  '@xmldom/xmldom': 0.8.15
  js-yaml: 4.3.2
  '@esbuild-kit/core-utils>esbuild': 0.25.12

onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
  - '@tailwindcss/oxide'
  - sharp
